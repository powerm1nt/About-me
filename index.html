<!DOCTYPE html>
<html lang="en" style="background-color: #121212;">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport"
          content="width=device-width, user-scalable=yes, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Personal blog, projects, and portfolio by Emi (powerm1nt)." />
    <meta name="keywords" content="Emi, powerm1nt, NukaWorks, blog, portfolio, developer, projects, tech" />
    <meta name="author" content="Emi (powerm1nt)" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://p.nuka.works" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://p.nuka.works" />
    <meta property="og:title" content="About Me — Blog & Portfolio" />
    <meta property="og:description" content="Personal blog, projects, and portfolio by Emi (powerm1nt)." />
    <meta property="og:image" content="https://nwrks-cdn.public.prod.nuka.works/static/pfp.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://p.nuka.works" />
    <meta name="twitter:title" content="About Me — Blog & Portfolio" />
    <meta name="twitter:description" content="Personal blog, projects, and portfolio by Emi (powerm1nt)." />
    <meta name="twitter:image" content="https://nwrks-cdn.public.prod.nuka.works/static/pfp.jpg" />

    <title>About Me — Blog & Portfolio</title>

    <link rel="icon" type="image/png" href="/favicon.png" />
</head>

<body style="background-color: #121212;">
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="app">
        <!-- Static skeleton shown until the bundle boots — matches the real app chrome.
             React replaces it wholesale when it mounts into #app. -->
        <div class="sk-shell">
            <header class="sk-header">
                <div class="sk-header-inner">
                    <div class="sk-pivot">
                        <span class="skeleton sk-nav-item" style="width:5.5rem"></span>
                        <span class="skeleton sk-nav-item" style="width:5rem"></span>
                        <span class="skeleton sk-nav-item" style="width:7.5rem"></span>
                        <span class="skeleton sk-nav-item" style="width:8.5rem"></span>
                    </div>
                    <span class="skeleton sk-avatar-tile"></span>
                </div>
            </header>

            <div class="sk-body">
                <div class="sk-content">
                    <div class="sk-meta-row">
                        <span class="skeleton skeleton-meta" style="width:120px"></span>
                        <span class="skeleton skeleton-meta" style="width:80px"></span>
                    </div>
                    <span class="skeleton skeleton-title" style="width:60%"></span>
                    <span class="skeleton skeleton-title" style="width:40%"></span>
                    <span class="skeleton skeleton-line" style="width:100%"></span>
                    <span class="skeleton skeleton-line" style="width:92%"></span>
                    <span class="skeleton skeleton-line" style="width:96%"></span>
                    <span class="skeleton skeleton-line" style="width:80%"></span>
                    <span class="skeleton skeleton-line" style="width:88%"></span>
                    <span class="skeleton skeleton-line" style="width:70%"></span>
                </div>
            </div>

            <footer class="sk-footer">
                <div class="sk-footer-inner">
                    <div class="sk-footer-left">
                        <span class="skeleton sk-footer-logo"></span>
                        <span class="skeleton sk-footer-copy"></span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
