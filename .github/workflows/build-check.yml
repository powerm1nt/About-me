name: Build check

# Compile check only: no credentials, no deploy, no secrets.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Frontend + API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # One install covers both workspace packages.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` runs tsc --noEmit first, so this typechecks the frontend too.
      - name: Build frontend
        run: pnpm build

      # The API's typecheck and build both run `prisma generate` first, which needs no database —
      # the generated client is gitignored, so without it a fresh checkout has nothing to compile
      # against.

      - name: Typecheck API
        run: pnpm --filter aboutme-server typecheck

      - name: Build API
        run: pnpm --filter aboutme-server build
