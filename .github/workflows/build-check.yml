name: Build check

# Pure compile check — no cloud credentials, no deploy, no secrets. Runs on every push to develop
# and on PRs into develop/main so breakage shows up before it ever reaches a deploy workflow.
# Excludes patch-only PRs (the propose/* branches from the "propose changes" feature) since those
# never touch buildable code.
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "patches/**"

jobs:
  build:
    name: Frontend + API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # One install covers both packages: the frontend is the workspace root and the API is the
      # "server" package (see pnpm-workspace.yaml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` runs tsc --noEmit first, so this covers frontend typechecking too.
      - name: Build frontend
        run: pnpm build

      - name: Typecheck API
        run: pnpm --filter aboutme-server typecheck

      - name: Build API
        run: pnpm --filter aboutme-server build
