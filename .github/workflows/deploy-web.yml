name: Deploy frontend to Cloud Storage

# Builds the React app and publishes it to the GCS bucket the load balancer serves
# blog.nuka.works from.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "patches/**"
      - "server/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bump has to happen before the build, since version.json is baked into the bundle — so a
      # run that fails later has still pushed a bump. That is harmless, but it means the branch can
      # have moved on by the time this step runs again (a re-run starts from the original commit,
      # and two pushes in quick succession overlap). Rebasing onto the current branch before pushing
      # makes the step idempotent instead of failing the whole deploy on a non-fast-forward.
      - name: Bump build number
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          FILE=public/version.json
          VERSION=$(jq -r '.version' "$FILE")
          BUILD=$(( $(jq -r '.build' "$FILE") + 1 ))
          jq --arg v "$VERSION" --argjson b "$BUILD" '.version = $v | .build = $b' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          git commit -am "chore: bump build number to $BUILD [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Hashed assets first, then index.html: uploading the shell last means it never points at
      # files that haven't finished uploading yet.
      # version.json is excluded alongside index.html because it is NOT content-hashed: it keeps
      # one fixed path and its contents change on every deploy. Uploaded with the immutable
      # year-long cache below, it pins at the edge, which is why the footer kept reporting an old
      # build number long after newer ones had shipped.
      - name: Upload hashed assets
        run: |
          gcloud storage rsync dist gs://${{ vars.GCP_WEB_BUCKET }} \
            --recursive --exclude '^(index\.html|version\.json)$' \
            --cache-control="public, max-age=31536000, immutable"

      - name: Upload index.html and version.json
        run: |
          gcloud storage cp dist/index.html gs://${{ vars.GCP_WEB_BUCKET }}/index.html \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp dist/version.json gs://${{ vars.GCP_WEB_BUCKET }}/version.json \
            --cache-control="no-cache, max-age=0"

      # index.html and version.json are the only paths that are not content-hashed, so they are
      # the only ones that can go stale at the edge — invalidating just those keeps the
      # invalidation quota free for content.
      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.GCP_URL_MAP }} \
            --path "/index.html" --async
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.GCP_URL_MAP }} \
            --path "/version.json" --async

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail
