name: Deploy blog to Cloud Run

# Builds the React frontend and Express API into one image. The shared load balancer and Cloud CDN
# serve both the app and /api from blog.nuka.works.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version.json is baked into the bundle, so the bump must precede the build and a later
      # failure still leaves one pushed. Rebase before pushing so a re-run or an overlapping push
      # doesn't fail the deploy on a non-fast-forward.
      - name: Bump build number
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          FILE=public/version.json
          VERSION=$(jq -r '.version' "$FILE")
          BUILD=$(( $(jq -r '.build' "$FILE") + 1 ))
          jq --arg v "$VERSION" --argjson b "$BUILD" '.version = $v | .build = $b' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          git commit -am "chore: bump build number to $BUILD [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/containers/blog-api:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_BASE_URL="" \
            --build-arg VITE_ASSET_BASE_URL="${{ vars.ASSET_BASE_URL }}" \
            -f server/Dockerfile \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Image only. Terraform owns the service environment and runtime identity.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.GCP_CLOUD_RUN_SERVICE }} \
            --image "${{ steps.image.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet

      # Origin headers keep /api sessions private and hashed assets immutable. Invalidating all
      # paths makes the new SPA shell visible immediately after a revision rolls out.
      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.GCP_URL_MAP }} \
            --path "/*" --async

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail
