name: Deploy frontend to Cloud Storage

# Builds the React app and publishes it to the GCS bucket the load balancer serves
# blog.nuka.works from.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "patches/**"
      - "server/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version.json is baked into the bundle, so the bump must precede the build and a later
      # failure still leaves one pushed. Rebase before pushing so a re-run or an overlapping push
      # doesn't fail the deploy on a non-fast-forward.
      - name: Bump build number
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          FILE=public/version.json
          VERSION=$(jq -r '.version' "$FILE")
          BUILD=$(( $(jq -r '.build' "$FILE") + 1 ))
          jq --arg v "$VERSION" --argjson b "$BUILD" '.version = $v | .build = $b' "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          git commit -am "chore: bump build number to $BUILD [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Hashed assets first so the shell never points at files still uploading. version.json is
      # excluded with index.html: it is not content-hashed, and the immutable cache below would pin
      # it at the edge.
      - name: Upload hashed assets
        run: |
          gcloud storage rsync dist gs://${{ vars.GCP_WEB_BUCKET }} \
            --recursive --exclude '^(index\.html|version\.json)$' \
            --cache-control="public, max-age=31536000, immutable"

      - name: Upload index.html and version.json
        run: |
          gcloud storage cp dist/index.html gs://${{ vars.GCP_WEB_BUCKET }}/index.html \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp dist/version.json gs://${{ vars.GCP_WEB_BUCKET }}/version.json \
            --cache-control="no-cache, max-age=0"

      # The only paths that aren't content-hashed, so the only ones that can go stale at the edge.
      - name: Invalidate CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.GCP_URL_MAP }} \
            --path "/index.html" --async
          gcloud compute url-maps invalidate-cdn-cache ${{ vars.GCP_URL_MAP }} \
            --path "/version.json" --async

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail
