name: Deploy Server to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "Server/**"
      - "Shared/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: blog-api
  AZURE_RESOURCE_GROUP: blog-api_group

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish Server/Server.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set App Service settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings BlobStorage__AccountKey=${{ secrets.BLOB_STORAGE_ACCOUNT_KEY }} \
                       GitHub__ClientId=${{ secrets.GH_OAUTH_CLIENT_ID }} \
                       GitHub__ClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: ${{ github.workspace }}/publish
