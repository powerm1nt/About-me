name: Check proposed content patches

# Proposal PRs come from forks, which GitHub denies credentials on a plain `pull_request` trigger.
# `pull_request_target` runs this file from the base repo — a fork cannot alter what the job does —
# and can mint an OIDC token. The only fork-supplied input is the `.patch` text, which is read as
# inert data and handed to `patch`/`gcloud`, never executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "patches/**/*.patch"

permissions:
  contents: read
  id-token: write

jobs:
  check-patches:
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.GCP_ASSETS_BUCKET }}
      PREFIX: ${{ vars.GCP_ASSETS_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Find patch files changed in this PR
        id: find
        run: |
          changed=$(git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'patches/**/*.patch' | awk '$1 != "D" { print $2 }')
          {
            echo "files<<EOF"
            echo "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Dry-run against current live content, to catch a proposal gone stale since it was opened.
      - name: Dry-run apply each patch against the live object
        if: steps.find.outputs.files != ''
        run: |
          fail=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            rel="${file#patches/}"
            target="${rel%/*}"
            object="gs://$BUCKET/$PREFIX/$target"
            echo "::group::Checking $file -> $object"

            tmp=$(mktemp)
            err=$(mktemp)

            if gcloud storage objects describe "$object" --format='value(name)' >/dev/null 2>"$err"; then
              gcloud storage cp "$object" "$tmp"
            elif grep -qiE 'not found|404' "$err"; then
              # Valid only for a "new article" proposal; an edit patch against a missing target
              # fails the dry-run below.
              echo "No existing object at '$object' — checking as a new file."
              : > "$tmp"
            else
              echo "::error file=$file::Could not read '$object' (not a not-found error — see log)."
              cat "$err"
              fail=1
              rm -f "$tmp" "$err"
              echo "::endgroup::"
              continue
            fi
            rm -f "$err"

            # Diffs are generated LF-only but stored content may carry CRLF, so normalize first or
            # unchanged context lines won't match.
            sed -i 's/\r$//' "$tmp"

            if ! patch --fuzz=3 --dry-run "$tmp" < "$file"; then
              echo "::error file=$file::Patch no longer applies cleanly to the current content of '$target' — the page was likely edited since this proposal was opened."
              fail=1
            fi

            rm -f "$tmp"
            echo "::endgroup::"
          done <<< "${{ steps.find.outputs.files }}"
          exit $fail
