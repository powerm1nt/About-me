name: Apply content patches to Cloud Storage

on:
  push:
    branches:
      - main
    paths:
      - "patches/**/*.patch"
  workflow_dispatch:
    inputs:
      patch_path:
        description: "Re-apply one already-merged patch (e.g. patches/README.md/20260809-023932.patch). Leave empty for normal newly-added-file detection."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.GCP_ASSETS_BUCKET }}
      PREFIX: ${{ vars.GCP_ASSETS_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Find newly added patch files
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.patch_path }}" ]; then
            added="${{ inputs.patch_path }}"
          else
            added=$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" -- 'patches/**/*.patch' | awk '$1 == "A" { print $2 }')
          fi
          if [ -z "$added" ]; then
            echo "No newly added patch files in this push."
          fi
          {
            echo "files<<EOF"
            echo "$added"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Every proposal's diff base is fetched fresh from storage at proposal time
      # (ProposalsController), so a patch that no longer applies cleanly means the content changed
      # since — fail loudly rather than silently corrupting the page.
      - name: Apply each patch to its target object
        if: steps.find.outputs.files != ''
        run: |
          set -e
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            rel="${file#patches/}"
            target="${rel%/*}"
            object="gs://$BUCKET/$PREFIX/$target"
            echo "::group::Applying $file -> $object"

            tmp=$(mktemp)
            err=$(mktemp)

            # `objects describe` separates "this page doesn't exist yet" from every other failure.
            # Treating a network/auth/throttling error as "new file" would silently overwrite an
            # existing page with just the diff's insertions.
            if gcloud storage objects describe "$object" --format='value(name)' >/dev/null 2>"$err"; then
              gcloud storage cp "$object" "$tmp"
            elif grep -qiE 'not found|404' "$err"; then
              # No existing object at this path — only valid for a "new article" proposal, whose
              # patch is a pure-insertion hunk (@@ -1,0 ...) that applies cleanly to an empty file.
              # An edit patch against a genuinely-missing target will just fail at the patch step.
              echo "No existing object at '$object' — treating as a new file."
              : > "$tmp"
            else
              echo "::error file=$file::Could not read '$object' (not a not-found error — see log)."
              cat "$err"
              exit 1
            fi
            rm -f "$err"

            # The diff is always generated LF-only (Server normalizes both sides before diffing),
            # but older content may still carry CRLF from earlier Windows-authored uploads —
            # normalize before patching so unchanged context lines match byte-for-byte.
            sed -i 's/\r$//' "$tmp"

            patch --fuzz=3 "$tmp" < "$file"

            gcloud storage cp "$tmp" "$object" \
              --content-type="text/markdown" \
              --cache-control="public, max-age=60"

            rm -f "$tmp"
            echo "::endgroup::"
          done <<< "${{ steps.find.outputs.files }}"

      # Content objects sit behind Cloud CDN with an hour-long TTL, so a merged edit would
      # otherwise take up to that long to become visible.
      - name: Invalidate CDN cache for patched pages
        if: steps.find.outputs.files != ''
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            rel="${file#patches/}"
            target="${rel%/*}"
            gcloud compute url-maps invalidate-cdn-cache "${{ vars.GCP_URL_MAP }}" \
              --path "/$PREFIX/$target" --async
          done <<< "${{ steps.find.outputs.files }}"
