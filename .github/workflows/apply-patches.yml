name: Apply content patches to Cloud Storage

on:
  push:
    branches:
      - main
    paths:
      - "patches/**/*.patch"
  workflow_dispatch:
    inputs:
      patch_path:
        description: "Re-apply one already-merged patch (e.g. patches/README.md/20260809-023932.patch). Leave empty for normal newly-added-file detection."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.GCP_ASSETS_BUCKET }}
      PREFIX: ${{ vars.GCP_ASSETS_PREFIX }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Find newly added patch files
        id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.patch_path }}" ]; then
            added="${{ inputs.patch_path }}"
          else
            added=$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" -- 'patches/**/*.patch' | awk '$1 == "A" { print $2 }')
          fi
          if [ -z "$added" ]; then
            echo "No newly added patch files in this push."
          fi
          {
            echo "files<<EOF"
            echo "$added"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # A patch that no longer applies means the content changed after the proposal was opened —
      # fail loudly rather than corrupting the page.
      - name: Apply each patch to its target object
        if: steps.find.outputs.files != ''
        run: |
          set -e
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            rel="${file#patches/}"
            target="${rel%/*}"
            object="gs://$BUCKET/$PREFIX/$target"
            echo "::group::Applying $file -> $object"

            tmp=$(mktemp)
            err=$(mktemp)

            # Separates "page doesn't exist yet" from any other failure: treating a network or auth
            # error as "new file" would overwrite a real page with only the diff's insertions.
            if gcloud storage objects describe "$object" --format='value(name)' >/dev/null 2>"$err"; then
              gcloud storage cp "$object" "$tmp"
            elif grep -qiE 'not found|404' "$err"; then
              # Valid only for a "new article" proposal, whose pure-insertion patch applies to an
              # empty file. An edit patch against a missing target fails at the patch step.
              echo "No existing object at '$object' — treating as a new file."
              : > "$tmp"
            else
              echo "::error file=$file::Could not read '$object' (not a not-found error — see log)."
              cat "$err"
              exit 1
            fi
            rm -f "$err"

            # Diffs are generated LF-only but stored content may carry CRLF, so normalize first or
            # unchanged context lines won't match.
            sed -i 's/\r$//' "$tmp"

            patch --fuzz=3 "$tmp" < "$file"

            gcloud storage cp "$tmp" "$object" \
              --content-type="text/markdown" \
              --cache-control="public, max-age=60"

            rm -f "$tmp"
            echo "::endgroup::"
          done <<< "${{ steps.find.outputs.files }}"

      # Content sits behind Cloud CDN with an hour TTL, so a merged edit would lag without this.
      - name: Invalidate CDN cache for patched pages
        if: steps.find.outputs.files != ''
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            rel="${file#patches/}"
            target="${rel%/*}"
            gcloud compute url-maps invalidate-cdn-cache "${{ vars.GCP_URL_MAP }}" \
              --path "/$PREFIX/$target" --async
          done <<< "${{ steps.find.outputs.files }}"
