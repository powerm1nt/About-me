name: Deploy API to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Built from the repository root: the API is a pnpm workspace package and the lockfile that
      # pins its dependencies lives there.
      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/containers/blog-api:${{ github.sha }}"
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Only the non-secret settings are passed here. The GitHub OAuth client secret is mounted
      # from Secret Manager by the service definition (see terraform/cloudrun.tf), so it never
      # passes through CI at all.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy blog-api \
            --image "${{ steps.image.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "GITHUB_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}" \
            --quiet
