<body style="background-color: #121212;">

    <script>
        // Monaco (BlazorMonaco) is only needed by the page editor, not by anonymous readers —
        // load it on demand from PageEditor.razor instead of on every page load.
        window.loadMonacoAssets = function () {
            if (window.__monacoAssetsPromise) return window.__monacoAssetsPromise;

            var load = function (src) {
                return new Promise(function (resolve, reject) {
                    var s = document.createElement('script');
                    s.src = src;
                    s.onload = resolve;
                    s.onerror = function () { reject(new Error('Failed to load ' + src)); };
                    document.head.appendChild(s);
                });
            };

            // editor.main.js's onload only means the file executed, not that Monaco is ready —
            // it kicks off its own async AMD require() chain that defines window.monaco later.
            // Poll for that before resolving, or BlazorMonaco tries to create the editor against
            // an undefined `monaco` and the editor comes up non-interactive.
            var waitForMonacoGlobal = function () {
                return new Promise(function (resolve) {
                    (function check() {
                        if (window.monaco) resolve();
                        else setTimeout(check, 30);
                    })();
                });
            };

            window.__monacoAssetsPromise = load('_content/BlazorMonaco/jsInterop.js')
                .then(function () { return load('_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js'); })
                .then(function () { return load('_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js'); })
                .then(waitForMonacoGlobal);

            return window.__monacoAssetsPromise;
        };

        // Focus trap for AppModal — keeps Tab/Shift+Tab cycling within the
        // dialog's own focusable elements instead of escaping into the page
        // behind the overlay.
        window.attachFocusTrap = function (containerEl) {
            function isTabbable(el) {
                return el instanceof HTMLElement && !el.disabled && el.tabIndex !== -1;
            }
            function handler(e) {
                if (e.key !== 'Tab') return;
                var focusables = Array.prototype.filter.call(
                    containerEl.querySelectorAll('button, a[href], [tabindex]'), isTabbable);
                if (focusables.length === 0) return;
                var first = focusables[0];
                var last = focusables[focusables.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
            containerEl.addEventListener('keydown', handler);
            containerEl.__focusTrapHandler = handler;
        };
        window.detachFocusTrap = function (containerEl) {
            if (containerEl && containerEl.__focusTrapHandler) {
                containerEl.removeEventListener('keydown', containerEl.__focusTrapHandler);
                delete containerEl.__focusTrapHandler;
            }
        };

        // Markdown-rendered article bodies are injected as raw HTML (MarkupString),
        // so their <a> tags carry no Blazor @onclick — this delegated listener is
        // the only way to route them through the same AppModal confirmation that
        // the ExternalLink component gives Razor-authored links (header, footer, etc).
        window.attachExternalLinkInterceptor = function (containerEl, dotNetRef) {
            if (!containerEl || containerEl.__externalLinkHandler) return;
            function handler(e) {
                var a = e.target.closest('a[href]');
                if (!a || !containerEl.contains(a)) return;
                var url;
                try { url = new URL(a.getAttribute('href'), window.location.href); }
                catch (err) { return; }
                if (url.origin === window.location.origin) return; // internal link — let it navigate normally
                e.preventDefault();
                var label = (a.textContent || '').trim() || url.hostname;
                dotNetRef.invokeMethodAsync('RequestExternalConfirm', url.href, label);
            }
            containerEl.addEventListener('click', handler);
            containerEl.__externalLinkHandler = handler;
        };
        window.detachExternalLinkInterceptor = function (containerEl) {
            if (containerEl && containerEl.__externalLinkHandler) {
                containerEl.removeEventListener('click', containerEl.__externalLinkHandler);
                delete containerEl.__externalLinkHandler;
            }
        };
    </script>
